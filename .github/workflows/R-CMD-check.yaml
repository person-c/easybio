# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

# A push that supersedes another leaves the older run checking a commit nobody
# is waiting for any more; the four-platform matrix is not cheap to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # local::. installs easybio itself, which the lint step needs: lintr
          # resolves a package's imports against the installed package, the
          # same reason `make lint` asks for `make install` first.
          extra-packages: any::rcmdcheck, any::covr, any::lintr, local::.
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - name: Lint
        if: always() && matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        # lintr::lint_package() prints its lints and returns them; on its own it
        # exits 0, so the step could never fail the build.
        run: |
          lints <- lintr::lint_package()
          print(lints)
          if (length(lints)) quit(status = 1)
        shell: Rscript {0}

      - name: Test coverage
        # always(), not success(): the lint step runs first and is allowed to
        # fail the job, and a failing step makes success() false for everything
        # after it -- so a lint error silently skipped the coverage upload.
        # The step is continue-on-error, so this only decides whether the
        # report is produced, never whether the build passes.
        if: always() && matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        # the upload is informative only: a codecov outage must not fail the build
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: covr::codecov()
        shell: Rscript {0}
